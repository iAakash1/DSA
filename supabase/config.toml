# Supabase CLI configuration.
#
# Migrations in supabase/migrations are GENERATED from the Alembic chain in
# backend/alembic/versions. Do not edit them by hand — see
# scripts/generate_supabase_migrations.py.

project_id = "cp-forge"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Local development only: skip the confirmation email round-trip.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
